<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="旅遊規劃工具：行程安排、分帳結算、打包清單。資料存在自己的瀏覽器，不上傳任何伺服器。">
<meta name="theme-color" content="#faf6ee">
<title>旅遊規劃 — 行程 · 分帳 · 打包清單</title>
<!-- 分頁圖示用單色線條的楓葉，不用 emoji（emoji 自帶顏色，會跟配色打架） -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239e3119' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M12 21v-5'/><path d='m12 16 5.5-3.2-1.6-.6 3.6-2.6-1.7-.5 2.2-2.6-4.3.5.4-2.3-2.6 1.3L12 3 10.5 6l-2.6-1.3.4 2.3-4.3-.5L6.2 9.1l-1.7.5 3.6 2.6-1.6.6z'/></svg>">
<!-- 版本號 ?v=N：改過 js/ 或 css/ 之後要把 N 加 1，
     否則瀏覽器會沿用舊檔，造成新舊程式混在一起。-->
<link rel="stylesheet" href="css/style.css?v=22">
</head>
<body>

<header class="topbar" id="topbar">
  <!-- 低高度封面：用這趟旅程第一張現有的行程圖片，沒有圖片就不出現 -->
  <div class="topbar-cover" id="headerCover" hidden></div>
  <div class="topbar-inner">
    <h1 id="headerTitle">旅遊規劃</h1>
    <div class="head-meta" id="headerMeta"></div>
    <div id="syncStatus" class="sync-status" hidden></div>
  </div>
</header>

<div id="readonlyBar" class="readonly-bar" hidden>
  你正在看別人分享的行程「<strong id="readonlyName"></strong>」，這是唯讀的，改不了。
</div>

<nav id="tabs" class="tabs" aria-label="主要分頁"></nav>

<main id="view" class="view"></main>

<footer class="foot">
  <p id="footNote"></p>
</footer>

<!-- 偶爾才用的操作放畫面右下，手機單手好按 -->
<nav id="headerActions" class="actionbar" aria-label="工具"></nav>

<script src="js/settle.js?v=22"></script>
<script src="js/store.js?v=22"></script>
<script src="js/cloud.js?v=22"></script>
<script src="js/share.js?v=22"></script>
<script src="js/ui.js?v=22"></script>
<script src="js/trips.js?v=22"></script>
<script src="js/itinerary.js?v=22"></script>
<script src="js/expenses.js?v=22"></script>
<script src="js/checklist.js?v=22"></script>
<script src="js/settings.js?v=22"></script>
<script src="js/app.js?v=22"></script>
</body>
</html>
